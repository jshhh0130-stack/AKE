name: 안드로이드 앱(APK) 만들기

# 앱 화면은 GitHub Pages 주소를 불러오므로, 웹을 고치면 설치한 앱에도 자동으로 반영된다.
# APK는 앱 껍데기(이름·아이콘·권한)를 바꿀 때만 다시 만들면 된다.
on:
  push:
    branches: [main]
    paths:
      - capacitor.config.json
      - .github/workflows/android.yml
      - public/icons/**
      - tools/android-res/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Capacitor 설치
        run: npm install --no-save @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8
      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android
      - name: 위치 권한 추가
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' $M
          cat $M
      - name: 앱 아이콘 넣기
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            dir=android/app/src/main/res/mipmap-$n
            mkdir -p $dir
            convert public/icons/icon-512.png -resize ${s}x${s} $dir/ic_launcher.png || cp public/icons/icon-192.png $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            convert public/icons/maskable-512.png -resize $((s*9/4))x$((s*9/4)) $dir/ic_launcher_foreground.png || true
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - run: npx cap sync android
      - name: APK 빌드
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ake.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ake-apk
          path: ake.apk
      - name: 다운로드 페이지(릴리스)에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "에이크 AKE 안드로이드 앱 (최신)" --notes "안드로이드 폰에서 ake.apk 를 내려받아 설치하세요. 설치 화면에서 '출처를 알 수 없는 앱' 허용이 필요할 수 있어요. 앱 내용은 웹 주소에서 불러오므로 앱을 다시 설치하지 않아도 자동으로 최신 버전이 보여요."
          gh release upload app-latest ake.apk --clobber
